name: Bug report
description: Report a reproducible editor or renderer defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include minimal Markdown/HTML and steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.1
  - type: input
    id: browser
    attributes:
      label: Browser / runtime
      placeholder: Chrome 140, Firefox 142, Safari 19…
